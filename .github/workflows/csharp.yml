name: LWBridge build and recovery checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify recovered assets and generated UI
        run: python tools/build_lwbridge_frontend.py --check
      - name: Build LWBridge desktop application
        run: dotnet build src/LWBridge.Desktop/LWBridge.Desktop.csproj --configuration Release
      - name: Capture all recovered desktop feature pages
        shell: pwsh
        run: ./tools/capture_lwbridge_ui.ps1
      - name: Install browser verification dependencies
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/lwbridge-ui-check" --no-save playwright@1.62.1
          python -m pip install Pillow==12.3.0
      - name: Compare the recovered frontend and rebuilt feature views
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/lwbridge-ui-check/node_modules"
          node tools/check_lwbridge_frontend.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/compare_lwbridge_frontend.py
      - name: Compile LWBridge recovery inspectors
        run: python -m py_compile tools/inspect_lwbridge_injection.py tools/inspect_lwbridge_map_scan.py tools/inspect_lwbridge_proxy_map_scan.py
