<section class="monster-afk-editor is-editing"><div class="monster-afk-editor-heading"><strong>放置設定を編集</strong><span class="monster-afk-mode-badge join">同盟集結に参加</span></div><div class="monster-afk-config-section"><strong>基本設定</strong><div class="monster-afk-basic-grid"><label><span>設定名</span><input value="Fixture profile"/></label><label><span>放置ターゲット</span><select><optgroup label="リーダー"><option value="boss" selected="">Fixture Rally Leader · リアルタイムマップ · 同盟集結に参加</option></optgroup></select></label></div><div class="monster-afk-custom-target"><label class="monster-afk-check-row"><input type="checkbox"/>カスタム対象</label></div></div><section class="rally-join-settings"><button type="button" class="toggle-row" role="switch" aria-checked="true" aria-label="集結参加条件: 有効"><span>集結参加条件</span><span class="ui-switch is-on" aria-hidden="true"></span></button><fieldset><div class="monster-afk-basic-grid"><label class="monster-afk-field-wide">参加タイミング<select aria-label="参加タイミング"><option value="slot" selected="">ランダムな参加位置</option><option value="delay">ランダムな遅延</option></select></label><div class="rally-join-range"><label>最も早い位置（主催者を含む）<input type="number" min="2" max="5" step="1" value="2"/></label><label>最も遅い位置（主催者を含む）<input type="number" min="2" max="5" step="1" value="2"/></label></div><label>人数到達後の遅延（秒、0＝遅延なし）<input type="number" min="0" max="6000" step="0.01" value="0"/></label><label>出発までの最大待ち時間（分、0＝無制限）<input type="number" min="0" step="1" value="5"/></label><label>主催者リスト<select aria-label="主催者リスト"><option value="off" selected="">制限なし</option><option value="blacklist">ブロックリスト</option><option value="whitelist">許可リスト</option></select></label></div><p class="muted">ランダムモードは集結ごとに値を1つ選びます。上下限が同じなら固定値です。自分の集結には参加しません。</p><p class="muted">入力範囲は2～5です。主催者が1番目のため、2は最初の参加部隊を指します。必要な部隊数に達してから遅延を開始します。人数が減ると取り消し、再び達した時点から計時します。目標位置がすでに埋まっていても空きがあれば、遅延を待たずにすぐ参加します。</p><button type="button" class="toggle-row" role="switch" aria-checked="false" aria-label="英雄1人の主催者を除外: 無効"><span>英雄1人の主催者を除外</span><span class="ui-switch" aria-hidden="true"></span></button><button type="button" class="toggle-row" role="switch" aria-checked="true" aria-label="追放された集結に再参加しない: 有効"><span>追放された集結に再参加しない</span><span class="ui-switch is-on" aria-hidden="true"></span></button></fieldset></section><div class="monster-afk-config-section"><strong>実行設定</strong><div class="monster-afk-basic-grid monster-afk-execution-grid"><div class="monster-afk-squad-field"><span>部隊タスク割り当て</span><div class="monster-afk-squads" role="group" aria-label="部隊タスク割り当て"><button class="monster-afk-squad-toggle" type="button" aria-label="第1部隊" aria-pressed="true">1</button><button class="monster-afk-squad-toggle" type="button" aria-label="第2部隊" aria-pressed="false">2</button><button class="monster-afk-squad-toggle" type="button" aria-label="第3部隊" aria-pressed="false">3</button><button class="monster-afk-squad-toggle" type="button" aria-label="第4部隊" aria-pressed="false">4</button></div></div><label title="部隊ごとに個別集計し、攻撃または集結参加を完了して帰還すると1回加算します。0は無限ループです"><span>実行回数（0 は無制限）</span><input type="number" min="0" step="1" value="0"/></label></div><label class="monster-afk-check-row"><input type="checkbox" checked=""/>帰還中に次の集結へ参加</label></div><div class="monster-afk-config-section monster-afk-filter"><strong>対象フィルター</strong><label class="monster-afk-check-row"><input type="checkbox"/>レベルを制限</label><label class="monster-afk-check-row"><input type="checkbox"/>距離を制限</label></div></section>
