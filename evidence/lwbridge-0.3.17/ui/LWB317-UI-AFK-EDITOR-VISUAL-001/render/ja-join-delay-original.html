<div class="monster-afk-editor "><div class="monster-afk-editor-heading"><strong>放置設定を編集</strong><span class="monster-afk-mode-badge join">同盟集結に参加</span></div><section class="monster-afk-config-section"><h3>基本設定</h3><div class="monster-afk-basic-grid"><label>設定名<input value="Fixture profile"/></label><label>放置ターゲット<select><optgroup label="リーダー"><option value="boss" selected="">Fixture Rally Leader · リアルタイムマップ · 同盟集結に参加</option></optgroup></select></label></div><div class="monster-afk-custom-target"><label class="monster-afk-check-row"><input type="checkbox"/>カスタム対象</label></div></section><section class="monster-afk-config-section monster-afk-join-section"><section class="rally-join-settings"><button type="button" class="toggle-row" role="switch" aria-checked="true" aria-label="集結参加条件: 有効"><span>集結参加条件</span><span class="ui-switch is-on" aria-hidden="true"></span></button><fieldset><div class="monster-afk-basic-grid"><label class="monster-afk-field-wide">参加タイミング<select aria-label="参加タイミング"><option value="slot">ランダムな参加位置</option><option value="delay" selected="">ランダムな遅延</option></select></label><div class="rally-join-range"><label>最小遅延（秒）<input type="number" min="0" max="6000" step="0.01" value="1"/></label><label>最大遅延（秒）<input type="number" min="0" max="6000" step="0.01" value="3"/></label></div><label>出発までの最大待ち時間（分、0＝無制限）<input type="number" min="0" step="1" value="5"/></label><label>主催者リスト<select aria-label="主催者リスト"><option value="off" selected="">制限なし</option><option value="blacklist">ブロックリスト</option><option value="whitelist">許可リスト</option></select></label></div><p class="muted">ランダムモードは集結ごとに値を1つ選びます。上下限が同じなら固定値です。自分の集結には参加しません。</p><p class="muted">集結の初回検出から計時し、選ばれた時間が経過すると空きがあれば参加します。参加位置は確認しません。</p><button type="button" class="toggle-row" role="switch" aria-checked="false" aria-label="英雄1人の主催者を除外: 無効"><span>英雄1人の主催者を除外</span><span class="ui-switch" aria-hidden="true"></span></button><button type="button" class="toggle-row" role="switch" aria-checked="true" aria-label="追放された集結に再参加しない: 有効"><span>追放された集結に再参加しない</span><span class="ui-switch is-on" aria-hidden="true"></span></button></fieldset></section></section><section class="monster-afk-config-section"><h3>実行設定</h3><div class="monster-afk-basic-grid monster-afk-execution-grid"><div class="monster-afk-squad-field"><span>部隊タスク割り当て</span><div class="monster-afk-squads" role="group" aria-label="部隊タスク割り当て"><button class="monster-afk-squad-toggle" type="button" aria-label="第1部隊" aria-pressed="true" title="第1部隊">1</button><button class="monster-afk-squad-toggle" type="button" aria-label="第2部隊" aria-pressed="false" title="第2部隊">2</button><button class="monster-afk-squad-toggle" type="button" aria-label="第3部隊" aria-pressed="false" title="第3部隊">3</button><button class="monster-afk-squad-toggle" type="button" aria-label="第4部隊" aria-pressed="false" title="第4部隊">4</button></div></div><label title="部隊ごとに個別集計し、攻撃または集結参加を完了して帰還すると1回加算します。0は無限ループです">実行回数（0 は無制限）<input type="number" min="0" step="1" value="0"/></label></div><label class="monster-afk-check-row"><input type="checkbox" checked=""/>帰還中に次の集結へ参加</label></section><section class="monster-afk-config-section"><h3>対象フィルター</h3><div class="monster-afk-filter"><label class="monster-afk-check-row"><input type="checkbox"/>レベルを制限</label></div><div class="monster-afk-filter"><label class="monster-afk-check-row"><input type="checkbox"/>距離を制限</label></div></section></div>
